<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>

<body>
    <div class="app-layout">
        <nav class="app-nav">
            <div class="app-header">
                <h1>Chat App</h1>
            </div>

            <button class="icon-btn" data-target="notifications" aria-label="Abrir notificaciones"
                title="Notificaciones">🔔</button>
            <button class="icon-btn" data-target="contacts" aria-label="Abrir contactos" title="Contactos">👥</button>
            <button class="icon-btn" data-target="chatrooms" aria-label="Abrir chats" title="Chats">💬</button>
            <button class="icon-btn" data-target="blocked-contacts" aria-label="Abrir bloqueados"
                title="Bloqueados">🚫</button>
            <button class="icon-btn" id="logout-btn" aria-label="Cerrar sesión" title="Cerrar sesión">🚪</button>

            <div id="user-info">
                <span id="username-display"></span>
            </div>
        </nav>

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-section" id="notifications-section">
                <h3>Notificaciones</h3>

                <ul class="data-list" id="notifications-list">
                    <!-- Las notificaciones se cargan acá -->
                </ul>
            </div>

            <div class="sidebar-section" id="contacts-section">
                <h3>Mis Contactos</h3>

                <div class="add-contact-section">
                    <input type="text" id="contact" placeholder="Nuevo contacto">
                    <button id="add-contact-btn">➕</button>
                </div>

                <ul class="data-list" id="contacts-list">
                    <!-- Los contactos se cargan acá -->
                </ul>
            </div>

            <div class="sidebar-section" id="chatrooms-section">
                <h3>Mis Chats</h3>

                <div class="create-groupchat-section">
                    <button id="new-group-chat-btn">Nuevo Grupo</button>
                </div>

                <ul class="data-list" id="chatrooms-list">
                    <!-- Los chats se cargan acá -->
                </ul>
            </div>

            <div class="sidebar-section" id="blocked-contacts-section">
                <h3>Contactos Bloqueados</h3>

                <ul class="data-list" id="blocked-contacts-list">
                    <!-- Los contactos bloqueados se cargan acá -->
                </ul>
            </div>
        </aside>



        <div class="chat-container">
            <header class="chat-header">
                <h3 id="chat-title">Chat</h3>
                <div id="connection-status" class="connection-status online" aria-live="polite">Conectado</div>
                <div class="chat-search">
                    <input type="text" id="search-input" placeholder="Buscar en el chat...">
                    <button id="search-btn" aria-label="Buscar mensajes">🔍</button>
                    <button id="prev-result" title="Resultado anterior" aria-label="Resultado anterior">⬆️</button>
                    <button id="next-result" title="Siguiente resultado" aria-label="Siguiente resultado">⬇️</button>
                    <span id="search-counter" class="search-counter" aria-live="polite"></span>
                </div>
            </header>

            <div class="chat-messages" id="chat-messages"></div>

            <div class="chat-input">
                <div id="selected-file-indicator" class="selected-file-indicator hidden" aria-live="polite">
                    <span id="selected-file-name" class="selected-file-name"></span>
                    <button id="clear-selected-file-btn" type="button" class="clear-selected-file-btn"
                        aria-label="Cancelar archivo seleccionado">✕</button>
                </div>
                <input type="text" id="message-input" placeholder="Escribí un mensaje...">
                <input type="file" id="file-input" style="display: none;">
                <button id="attach-file-btn">📎</button>
                <button id="send-message-btn">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Modal para crear grupo -->
    <div id="group-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Crear nuevo grupo</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="group-name">Nombre del grupo:</label>
                    <input type="text" id="group-name" placeholder="Ej: Amigos del trabajo">
                </div>
                <div class="form-group">
                    <label>Selecciona participantes:</label>
                    <div id="contacts-list-modal" class="contacts-list">
                        <!-- Los contactos se cargan aca -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="create-group-btn" class="btn-primary">Crear grupo</button>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <div id="confirm-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
        <div class="modal-content confirm-modal-content">
            <div class="modal-header">
                <h3 id="confirm-modal-title">Confirmar acción</h3>
            </div>
            <div class="modal-body">
                <p id="confirm-modal-message" class="confirm-modal-message">¿Confirmar acción?</p>
            </div>
            <div class="modal-footer">
                <button id="confirm-cancel-btn" class="btn-secondary" type="button">Cancelar</button>
                <button id="confirm-ok-btn" class="btn-primary" type="button">Confirmar</button>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/sidebar.js"></script>
    <script src="/static/js/contacts.js"></script>
    <script src="/static/js/chatrooms.js"></script>
    <script src="/static/js/notifications.js"></script>
    <script src="/static/js/blocked_contacts.js"></script>

</body>

</html>
