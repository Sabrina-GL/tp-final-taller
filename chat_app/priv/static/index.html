<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/app.css">
</head>

<body>
    <div class="app-layout">
        <nav class="app-nav">
            <div class="app-header">
                <h1>Chat App</h1>
            </div>

            <button class="icon-btn" data-target="contacts">👥</button>
            <button class="icon-btn" data-target="chatrooms">💬</button>
            <button class="icon-btn" id="logout-btn">🚪</button>

            <div id="user-info">
                <span id="username-display"></span>
            </div>
        </nav>

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-section" id="contacts-section">
                <h3>Mis Contactos</h3>

                <div class="add-contact-section">
                    <input type="text" id="contact" placeholder="Nuevo contacto">
                    <button id="add-contact-btn">➕</button>
                </div>

                <ul class="data-list" id="contacts-list"></ul>
            </div>

            <div class="sidebar-section" id="chatrooms-section">
                <h3>Mis Chats</h3>

                <div class="create-groupchat-section">
                    <button id="new-group-chat-btn">Nuevo Grupo</button>
                </div>

                <ul class="data-list" id="chatrooms-list"></ul>
            </div>
        </aside>



        <div class="chat-container">
            <header class="chat-header">
                <h3 id="chat-title">Chat</h3>
            </header>

            <div class="chat-messages" id="chat-messages"></div>

            <div class="chat-input">
                <input type="text" id="message-input" placeholder="Escribí un mensaje...">
                <button id="send-message-btn">Enviar</button>
            </div>
        </div>
    </div>

    <!-- Modal para crear grupo -->
    <div id="group-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Crear nuevo grupo</h3>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="group-name">Nombre del grupo:</label>
                    <input type="text" id="group-name" placeholder="Ej: Amigos del trabajo">
                </div>
                <div class="form-group">
                    <label>Selecciona participantes:</label>
                    <div id="contacts-list-modal" class="contacts-list">
                        <!-- Los contactos se cargan aca -->
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="create-group-btn" class="btn-primary">Crear grupo</button>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
    <script src="/static/js/sidebar.js"></script>
    <script src="/static/js/contacts.js"></script>
    <script src="/static/js/chatrooms.js"></script>

</body>

</html>
